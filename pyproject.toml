[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotenai-zeus-client"
version = "0.1.0"
description = "Python client library for Zeus AI data servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Koten AI"},
]
dependencies = [
    "httpx>=0.28.1",
    "python-toon>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/koten-ai/zeus_client_python"
Repository = "https://github.com/koten-ai/zeus_client_python"

[tool.setuptools]
package-dir = {"zeus_client" = "src"}
packages = [
    "zeus_client",
    "zeus_client.agent",
    "zeus_client.llm",
    "zeus_client.trace",
    "zeus_client.zeus",
]

[tool.setuptools.package-data]
zeus_client = ["data/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["zeus_client"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]