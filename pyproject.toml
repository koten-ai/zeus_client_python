[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotenai-zeus-client"
# GA cutover (ZCP-39): default import is V2 Runtime tree as zeus_client 2.0.0
version = "2.2.0"
description = "Python client library for Zeus AI data servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Koten AI"},
]
dependencies = [
    "httpx>=0.28.1",
    "python-toon>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "build>=1.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/koten-ai/zeus_client_python"
Repository = "https://github.com/koten-ai/zeus_client_python"

[tool.setuptools]
package-dir = { "zeus_client" = "src/zeus_client", "zeus_client_v2" = "src/zeus_client_v2_alias" }
packages = [
    "zeus_client",
    "zeus_client.api",
    "zeus_client.domain",
    "zeus_client.domain.journal",
    "zeus_client.application",
    "zeus_client.application.detective",
    "zeus_client.application.projectors",
    "zeus_client.ports",
    "zeus_client.adapters",
    "zeus_client.adapters.zeus_http",
    "zeus_client.adapters.llm_openai_compatible",
    "zeus_client.adapters.hub_debug_http",
    "zeus_client.adapters.catalog_fs",
    "zeus_client.adapters.secrets_env",
    "zeus_client.adapters.otlp",
    "zeus_client.adapters.jobs_http",
    "zeus_client.adapters.jobs_fake",
    "zeus_client.config",
    "zeus_client.security",
    "zeus_client.compat",
    "zeus_client.compat.v1",
    "zeus_client.observability",
    # Temporary deprecation alias (slipped to ≤2.3.0; Mode 3 landed at 2.1.0)
    "zeus_client_v2",
]

[tool.setuptools.package-data]
zeus_client = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".*", "build", "dist", "*.egg", "src_v1_legacy", "legacy_v1"]
markers = [
    "unit: fast isolated tests",
    "contract: adapter contract tests (respx/fakes)",
    "conformance: offline conformance suite",
    "integration: requires live Zeus/lab (excluded from default CI)",
    "security: security-focused checks",
]

[tool.coverage.run]
source = ["zeus_client"]
branch = true
omit = ["*/zeus_client_v2_alias/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src_v1_legacy",
    "src/zeus_client_v2_alias",
    "tests/legacy_v1",
    "build",
    "dist",
]

[tool.ruff.lint]
# Day-1 CI bar: correctness + imports + pyupgrade + bugbear.
# E501/E402/UP042 and SIM pedantry deferred (expand later without churn).
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "UP042", "UP007"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["zeus_client"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["src_v1_legacy/", "src/zeus_client_v2_alias/"]

# Adapters: soft (HTTP shapes). Application/compat: ignore until typed pass.
[[tool.mypy.overrides]]
module = [
    "zeus_client.adapters.*",
]
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "zeus_client.application.*",
    "zeus_client.compat.*",
]
ignore_errors = true
