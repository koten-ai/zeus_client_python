# Required merge gate for kotenai-zeus-client.
# Aligns with docs/V2/BEST_PRACTICES.md §11.1 and Makefile `make ci`.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Baseline ~79% (2026-08-13); floor baseline-4 for headroom.
  COV_FAIL_UNDER: "75"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev extras
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - run: mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test + coverage
        run: |
          pytest -q -m "not integration" \
            --cov=zeus_client \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ env.COV_FAIL_UNDER }}
      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build · twine check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Version clocks match
        run: |
          set -euo pipefail
          PY_VER=$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.M).group(1))")
          IMP_VER=$(python -c "from pathlib import Path; ns={}; exec(Path('src/zeus_client/_version.py').read_text(), ns); print(ns['__version__'])")
          echo "pyproject=$PY_VER _version=$IMP_VER"
          test "$PY_VER" = "$IMP_VER"
      - name: Build sdist/wheel
        run: |
          rm -rf dist build
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  audit:
    name: pip-audit (non-blocking until ZCP-44)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip-audit
